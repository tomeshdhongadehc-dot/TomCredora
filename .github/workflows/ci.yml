name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Production deps only: the dev-only eslint-config-next chain has an open ReDoS advisory (braces) with no non-breaking fix.
      - run: npm audit --omit=dev --audit-level=high
      - name: No secrets in the client bundle
        run: |
          npm run build
          ! grep -rE "AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|eyJhbGciOi[A-Za-z0-9._-]{40,}" .next/static || (echo "Possible secret in client bundle" && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }
